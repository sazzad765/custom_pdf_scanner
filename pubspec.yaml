name: custom_pdf_scanner
description: Configurable local document scanner for Flutter with single & multi-page capture, OpenCV perspective crop & filters, reorderable page list, and streaming PDF export.
version: 0.1.0
homepage: https://github.com/sazzad765/custom_pdf_scanner
repository: https://github.com/sazzad765/custom_pdf_scanner
issue_tracker: https://github.com/sazzad765/custom_pdf_scanner/issues

topics:
  - document-scanner
  - pdf
  - opencv
  - camera
  - image-processing

platforms:
  android:
  ios:

environment:
  sdk: ^3.10.0
  flutter: ">=3.24.0"

dependencies:
  camera: ^0.11.3
  crypto: ^3.0.7
  dartcv4: ">=2.2.2 <2.3.0"
  flutter:
    sdk: flutter
  google_mlkit_document_scanner: ^0.5.0
  path: ^1.9.1
  path_provider: ^2.1.6

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

hooks:
  user_defines:
    dartcv4:
      include_modules:
        - imgcodecs
        - imgproc
