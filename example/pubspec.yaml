name: custom_pdf_scanner_example
description: Example host app demonstrating single-page, multi-page, embedded reorderable list, PDF preview, and scan history with custom_pdf_scanner.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.10.0

dependencies:
  custom_pdf_scanner:
    path: ../
  file_picker: ^10.3.7
  flutter:
    sdk: flutter
  flutter_pdfview: ^1.4.3
  path: ^1.9.1
  path_provider: ^2.1.6

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true

# Compile only the OpenCV modules required by custom_pdf_scanner.
hooks:
  user_defines:
    dartcv4:
      include_modules:
        - imgcodecs
        - imgproc
